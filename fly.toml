# Fly.io configuration for warehouse-duckdb (the labordata.bunkum.us origin).
#
# Data-less image (Dockerfile): the .duckdb databases live on a Fly Volume
# mounted at /data and are updated out-of-band by refresh-data.yml.

app = "warehouse-duckdb"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# NB: no [mounts] block. A [mounts] here would make `flyctl deploy` create a
# second machine on a fresh empty volume, and the Fly proxy would round-robin
# between it and the real one (half of requests get no databases). Volumes are
# instead created and attached per-refresh by refresh-data.yml via
# `flyctl machine run --volume <id>:/data`.

# The live machine's services do NOT come from this block. deploy.yml only
# builds here (--build-only) and rolls the image with `machine update --image`,
# and refresh-data.yml promotes each new machine with
# `machine update --port 80:8080/tcp:http --port 443:8080/tcp:tls:http`. So
# the machine runs Fly's defaults: connection-based concurrency, soft limit 20,
# no hard limit, no Fly health checks. A [services.concurrency] or
# [[services.http_checks]] here would be silently ignored, which is why neither
# is kept (a stale hard_limit=100 here misled the 2026-09-22 wedge diagnosis).
# Overload shedding lives in the app (plugins/query_concurrency.py); health is
# checked by refresh-data.yml's smoke test before a new machine is promoted.
[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

# shared-cpu-4x, not 1x (2026-09-18). Fly shared CPUs run on a burst-credit
# bank over a baseline of 1/16 core per vCPU; a few minutes of full-CPU export
# traffic drains the bank and the machine is then held to the baseline, where
# the request queue never drains and every request 524s until restarted (the
# 2026-06-19, 09-15 and 09-18 wedges -- fly_instance_cpu_balance hits 0 and
# steal goes to ~92%). Each daily refresh also replaces the machine, and a new
# one starts with ~1/7 of a full bank. 4 vCPUs = 4x baseline and 4x bank for
# ~$2/mo (RAM dominates the price), and DuckDB releases the GIL so the SQL
# threads actually run in parallel. NB: refresh-data.yml's `machine run` flags
# are what size the live machine; keep --vm-cpus in step with this.
[[vm]]
  size = "shared-cpu-4x"
  memory = "2gb"
  cpus = 4
