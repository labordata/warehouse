# Datasette config for the DuckDB deployment (app: warehouse-duckdb).
#
# Canned queries, translated from SQLite to DuckDB:
#   * datetime(col,'utc')||'Z'  ->  strftime(col,'%Y-%m-%dT%H:%M:%SZ')
#   * For columns we know are TIMESTAMP (e.g. nlrb.filing.created_at,
#     surveyed at the time of conversion), strftime takes the value directly.
#   * For columns whose underlying SQLite type was TEXT and that the converter
#     therefore left as VARCHAR (the lm20 receiveDate), use
#     strftime(try_cast(col as timestamp), '%Y-%m-%dT%H:%M:%SZ') so the format
#     works whether the underlying storage is TIMESTAMP or an ISO-shaped string.
#     (See issue #9 — once the converter promotes date-ish TEXT columns the
#     try_cast becomes a no-op and can come back out.)
#   * SQLite tolerates referencing SELECT aliases in WHERE. DuckDB follows the
#     standard and doesn't, so the lm20 query wraps in a CTE.
#   * `sqlite_sequence` table-hide tweak isn't needed — DuckDB has no such
#     table to hide.

extra_css_urls:
  - /static/custom.css?v=1

extra_js_urls:
  - /static/sticky-thead.js?v=4

plugins:
  datasette-duckdb:
    # Shared-instance mode: route every database through ONE process-wide DuckDB
    # instance (all dbs ATTACHed as catalogs, addressed per-cursor via USE)
    # instead of N independent per-db instances. This gives a SINGLE global
    # memory budget for the whole process (no per-instance oversubscription ->
    # the OOM #30) AND lets a single big operation (large CSV export / sort) use
    # the whole budget instead of being starved by a low per-instance cap (which
    # broke 500k-row CSV exports). See fgregg/datasette#31.
    shared_instance: true
    # The single global memory_limit (vs the old 128MB-per-instance cap). ~1.4GB
    # leaves headroom for base + python on the 2GB box.
    memory_limit: 1400MB
    # 1 vCPU: more threads only multiply sort/agg memory and worsen latency-
    # fairness (measured), with no compute gain.
    threads: 1
    # ROLLBACK: to revert to per-instance mode set `shared_instance: false` AND
    # `memory_limit: 128MB` together (a 1.4GB *per-instance* cap would OOM).
  query-concurrency:
    # Bounded-wait cap on custom-SQL (?sql= on .json/.csv) execution. The shared
    # instance serializes heavy queries through one threads=1 master on a 1-vCPU
    # box, so without a cap a single automated client starves the whole site (it
    # 524'd 2026-06-22). max_concurrent run at once; when full, a request WAITS
    # up to queue_wait for a slot before getting 429 + Retry-After. Cheap bursts
    # (e.g. notes.labordata chart pages firing ~6 concurrent ?sql=) free slots
    # in ms and drain through the wait; only genuinely heavy load holds slots
    # past queue_wait and sheds. max_queue bounds waiters. Non-SQL traffic and
    # HTML query pages are never gated. See plugins/query_concurrency.py.
    # 3 == num_sql_threads (the real ceiling); set 2 to reserve a browse thread.
    max_concurrent: 3
    queue_wait: 1.5
    max_queue: 20
    retry_after: 5
  nosuggest-facets:
    # Facet *suggestion* runs one grouped query per column. usaspending's
    # contracts view has 293 columns over Parquet (~30ms each, and the cost is
    # per-query decode, so it does not shrink with fewer files or lower time
    # limits): ~18s a page, against ~0.5s for the page itself. Skipping
    # suggestion for this database alone brings it back to ~0.5s. Explicit
    # ?_facet= and any configured facets still work, and the native tables --
    # where suggestion costs ~0.15s and earns it -- keep theirs.
    databases:
      - usaspending
  datasette-block-robots:
    literal: |-
      User-agent: *
      Disallow: /*?
      Disallow: /*/sqlite_*
      Disallow: /*/_*
      Disallow: /*/*_fts
      Disallow: /*/*_fts_*

      User-agent: Claude-User
      Disallow:

      User-agent: ChatGPT-User
      Disallow:

      User-agent: Perplexity-User
      Disallow:

      Sitemap: https://labordata.bunkum.us/sitemap.xml
  schema-org:
    creator:
      "@type": Person
      "@id": https://orcid.org/0009-0001-8330-9219
      name: Forest Gregg
      url: https://bunkum.us/
    keywords:
      - labor
      - labor unions
      - United States
    defaults:
      spatialCoverage: United States
      isAccessibleForFree: true
      inLanguage: en
      license: https://creativecommons.org/publicdomain/mark/1.0/
    exclude:
      - cats
      - chips
      - union_names_crosswalk

databases:
  nlrb:
    queries:
      new_rc_cases:
        title: New petitions for representation elections
        sql: |-
          select
            case_number as atom_id,
            name as atom_title,
            strftime(created_at, '%Y-%m-%dT%H:%M:%SZ') as atom_updated,
            url as atom_link,
            printf(
              '<p>Case Number: <a href="%s">%s</a></p><p>Filed on: %s</p><p>%,d workers at %s petitioned for a representation election in %s, %s</p>',
              url,
              case_number,
              date_filed,
              number_of_voters_on_petition_or_charge,
              name,
              city,
              state
            ) as atom_content_html
          from
            filing
          where
            case_type = 'RC'
          order by
            created_at desc,
            date_filed desc
          limit
            100
  lm20:
    queries:
      new_lm20_filings:
        title: New LM20 Filings
        sql: |-
          select
            distinct rptID,
            printf(
              '%s vs %s',
              employer.empLabOrg,
              specific_subject_labor_orgs
            ) as atom_title,
            filing_url as atom_link,
            strftime(
              try_cast(receiveDate as timestamp),
              '%Y-%m-%dT%H:%M:%SZ'
            ) as atom_updated,
            printf(
              '<p>%s (%s, %s) hired %s to meet with %s to help convince workers not to organize with %s</p>',
              employer.empLabOrg,
              employer.city,
              employer.state,
              coalesce(contact.organization, contact.name),
              specific_subject_employees,
              specific_subject_labor_orgs
            ) as atom_content_html,
          from
            filing
            inner join employer using (rptId)
            inner join specific_activity using (rptId)
            inner join contact using (rptId)
          where
            contact_type = 'name_and_mailing_address'
            and atom_updated is not null
            and atom_title is not null
            and atom_content_html is not null
          order by
            receiveDate desc
          limit
            100
  usaspending:
    # Per-recipient drill-downs. The contracts Parquet is sorted by
    # recipient_uei, so a single-UEI filter prunes to a few row groups and
    # these run in well under a second against all 93M rows -- no rollup
    # needed. Find a UEI on the recipients view first.
    queries:
      spending_by_year:
        title: One recipient's obligations by fiscal year and agency
        sql: |-
          select
            action_date_fiscal_year as fiscal_year,
            awarding_agency_name,
            count(*) as transactions,
            count(distinct award_id_piid) as awards,
            sum(federal_action_obligation) as obligations,
            sum(federal_action_obligation) filter (where labor_standards_code = 'Y' or labor_standards = 'Y') as service_contract_act_obligations,
            sum(federal_action_obligation) filter (where construction_wage_rate_requirements_code = 'Y') as davis_bacon_obligations
          from contracts
          where recipient_uei = :uei
          group by 1, 2
          order by 1 desc, obligations desc
      spending_by_place:
        title: Where one recipient performs its federal contracts
        sql: |-
          select
            primary_place_of_performance_state_code as state,
            primary_place_of_performance_county_name as county,
            primary_place_of_performance_city_name as city,
            count(distinct award_id_piid) as awards,
            sum(federal_action_obligation) as obligations,
            min(action_date) as first_action,
            max(action_date) as last_action
          from contracts
          where recipient_uei = :uei
          group by 1, 2, 3
          order by obligations desc
      awards_for_recipient:
        title: One recipient's contracts, one row per award
        sql: |-
          select
            award_id_piid,
            parent_award_id_piid,
            arg_max(awarding_sub_agency_name, action_date) as awarding_sub_agency,
            arg_max(prime_award_base_transaction_description, action_date) as description,
            arg_max(naics_description, action_date) as naics,
            arg_max(labor_standards, action_date) as service_contract_act,
            arg_max(construction_wage_rate_requirements, action_date) as davis_bacon,
            arg_max(primary_place_of_performance_state_code, action_date) as state,
            min(period_of_performance_start_date) as start_date,
            max(period_of_performance_current_end_date) as end_date,
            count(*) as transactions,
            sum(federal_action_obligation) as obligations
          from contracts
          where recipient_uei = :uei
          group by 1, 2
          order by obligations desc
      recipients_by_name:
        title: Find recipient UEIs by name
        sql: |-
          select
            recipient_uei, recipient_name, doing_business_as, city, state,
            first_fiscal_year, last_fiscal_year, obligations, top_naics
          from recipients
          where recipient_name ilike '%' || :name || '%'
             or doing_business_as ilike '%' || :name || '%'
          order by obligations desc
          limit 200
